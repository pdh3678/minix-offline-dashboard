# ⚠ 이 서비스들은 Render 대시보드 설정으로 운영되며 이 파일은 참고용 기록이다(Blueprint로 동기화되지 않는다).
#   이 파일을 고쳐도 배포는 바뀌지 않는다 — 대시보드 Settings에서 바꾼 뒤 여기에도 같은 값을 적어 둘 것.
#   (2026-09-28 확인: Build Command·Publish Directory는 대시보드에서 바꿔야 실제로 바뀌었다)
#
# 운영 서비스 — 둘 다 같은 저장소·같은 설정으로 배포된다
#   minix-offlinepart-dashboard  https://minix-offlinepart-dashboard.onrender.com  현재 주소(아래 항목)
#   minix-gongu-dashboard        https://minix-gongu-dashboard.onrender.com        옛 주소 — index.html 맨 위 스크립트가
#                                경로·쿼리·해시를 유지한 채 현재 주소로 리다이렉트한다
services:
  - name: minix-offlinepart-dashboard
    type: web
    runtime: static
    # 회고 편집기를 빌드한 뒤 공개 허용 목록(index.html·dashboard.html·src/·review-assets/·로고·파비콘)만
    # public/에 복사하고 그 폴더만 배포한다 — 저장소 루트를 배포하면 apps-script*.js·tests/ 등이 공개된다.
    # 공개 파일을 추가하면 scripts/build-public.sh의 PUBLIC_FILES / PUBLIC_DIRS에 넣을 것.
    # ⚠ 공개 목록에서 빠진 파일이 이전 배포의 것으로 계속 서빙될 수 있다 — 그럴 땐 Manual Deploy → Clear build cache & deploy
    buildCommand: bash scripts/build-public.sh
    staticPublishPath: public
    # ⚠ 아래 headers는 의도한 값의 기록이다. 2026-09-28 라이브 실측(두 서비스 동일)과 다르다:
    #   Cache-Control = public, max-age=0, s-maxage=300 (아래 no-cache 아님)
    #   Content-Security-Policy = frame-ancestors 'self' https://minix-workspace.onrender.com 만
    #   (object-src·base-uri·form-action과 Report-Only 헤더는 나가지 않음)
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      # iframe 임베드 허용 범위 (2026-09-15).
      # Render는 X-Frame-Options를 붙이지 않는다(실측 확인) — 즉 지금까지는 아무 사이트나 이
      # 대시보드를 iframe에 넣을 수 있었다. frame-ancestors로 그 범위를 명시적으로 좁힌다.
      # 'self'  = 대시보드 자신(같은 오리진 미리보기 등)
      # minix-workspace.onrender.com = 세일즈 팀 워크스페이스
      # ⚠ 워크스페이스에 커스텀 도메인을 붙이면 그 도메인도 여기에 추가해야 한다. 빠뜨리면
      #   부모 페이지에서 iframe이 "연결 거부"처럼 빈 화면으로만 보이고 콘솔에만 CSP 오류가 남는다.
      # ⚠ X-Frame-Options는 일부러 넣지 않는다. ALLOW-FROM은 모든 최신 브라우저에서 폐기됐고,
      #   DENY/SAMEORIGIN을 넣으면 frame-ancestors보다 우선 적용돼 임베드가 막힌다.
      #
      # 강제 적용분 (2026-09-16에 세 가지 추가) — 셋 다 이 앱이 원래 쓰지 않는 기능이라
      # 켜도 깨질 것이 없고, 켜두면 공격자가 쓸 수 있는 수단만 줄어든다.
      #   object-src 'none'  : <object>/<embed> 플러그인 삽입 차단
      #   base-uri 'self'    : <base> 태그로 모든 상대경로를 남의 서버로 돌리는 수법 차단
      #   form-action 'self' : 주입된 폼이 외부로 전송되는 것 차단
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self' https://minix-workspace.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'"

      # ── script-src 등 전체 정책은 아직 Report-Only다 (2026-09-16) ─────────────
      # 왜 바로 강제하지 않는가: 본체는 src/ 파일로 나뉘었지만(2026-09-25) 수백 개의 인라인
      # onclick 핸들러와 head의 임베드 판정 스크립트가 남아 있어 script-src에 'unsafe-inline'을
      # 넣을 수밖에 없다. Render는 정적 호스팅이라 요청마다
      # nonce를 심을 수 없고, 해시 방식은 배포할 때마다 값이 바뀌어 유지가 안 된다.
      #
      # 그래도 의미가 있다: 'unsafe-inline'이 있어도 **외부 스크립트 로드는 막힌다**.
      # 저장형 XSS의 실제 페이로드는 대부분 <script src="공격자서버">라서, 그 경로가 닫힌다.
      #
      # Report-Only는 차단하지 않고 위반만 콘솔에 남긴다. 아래 순서로 검증 후 전환할 것:
      #   1) 배포 후 대시보드를 평소처럼 한 바퀴 쓴다 — 로그인, 캘린더, 회고 열기/이미지 업로드,
      #      릴스 썸네일, 워크스페이스 iframe 진입까지 전부.
      #   2) 콘솔에 "Content-Security-Policy-Report-Only" 위반이 하나도 안 뜨면,
      #      위 강제 헤더의 value를 아래 value로 통째로 교체하고 이 Report-Only 블록을 지운다.
      #   3) 위반이 뜨면 그 origin을 해당 지시어에 추가한 뒤 1)부터 다시.
      #
      # 각 출처가 필요한 이유:
      #   accounts.google.com  로그인(GSI 스크립트 + FedCM/One Tap iframe)
      #   cdn.jsdelivr.net     Chart.js, Pretendard 폰트 CSS·woff2
      #   cdn.sheetjs.com      SheetJS(데이터 업로드 화면에서만 지연 로드, SRI 고정 — npm판은 CVE 미수정)
      #   script.google.com    Apps Script 웹앱 호출(모든 데이터 왕복)
      #   *.googleusercontent.com  구글 프로필 사진
      #   data: / blob:        릴스 썸네일(GAS가 base64로 내려줌)과 이미지 업로드 미리보기
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.googleusercontent.com https://script.google.com; connect-src 'self' https://script.google.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self' https://minix-workspace.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'"
