       scripts/build-public.sh가 상대경로를 찾으면 빌드를 실패시킨다.
     대시보드(index.html)의 스크립트는 하나도 싣지 않는다 — 공용 설정(config.js: Apps Script 주소)과 설문 파일만. -->
